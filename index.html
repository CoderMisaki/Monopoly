<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="description" content="City Empire — game strategi properti 3D mewah. Bangun rumah, upgrade Landmark, ambil alih kota." />
    <meta name="theme-color" content="#0b0e15" />
    <title>City Empire — Monopoli 3D Mewah</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body,
      #app {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #0b0e15;
      }
      body {
        font-family: 'Inter', 'Segoe UI', sans-serif;
        color: #f2ead8;
        -webkit-font-smoothing: antialiased;
      }
      #app {
        position: relative;
      }
      ::selection {
        background: rgba(212, 175, 55, 0.35);
        color: #fff8e1;
      }
      button {
        font-family: inherit;
      }
      button:hover {
        transform: translateY(-1px);
      }
      button:active {
        transform: translateY(0);
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
